<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Folio — Ask your documents</title>
  <meta name="description" content="Folio turns your team's internal documents into answers you can trust, with a citation behind every claim." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f8fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#090c13" media="(prefers-color-scheme: dark)" />

  <!-- Inlined so the tab icon needs no extra request and no external host. -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='55%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9.5 8.5h8.2a4.8 4.8 0 0 1 4.8 4.8v10.2h-8.2a4.8 4.8 0 0 1-4.8-4.8V8.5Z' fill='%23fff' opacity='.32'/%3E%3Cpath d='M9.5 8.5h6.1a4.8 4.8 0 0 1 4.8 4.8v10.2H14.3a4.8 4.8 0 0 1-4.8-4.8V8.5Z' fill='%23fff' opacity='.95'/%3E%3C/svg%3E"
  />

  <style>
    /*
     * Painted before Angular boots so the first frame is already the right
     * theme — otherwise a dark-mode user gets a white flash on every load.
     * ThemeService takes over once the app starts.
     */
    html { background: #f7f8fb; }
    @media (prefers-color-scheme: dark) { html { background: #090c13; } }
    html[data-theme='light'] { background: #f7f8fb; }
    html[data-theme='dark'] { background: #090c13; }
    body { margin: 0; }

    /* First-paint splash, removed as soon as the app renders. */
    .boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }
    .boot-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6 55%, #ec4899);
      animation: boot-pulse 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes boot-pulse {
      0%, 100% { opacity: 0.45; transform: scale(0.94); }
      50%      { opacity: 1;    transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-mark { animation: none; opacity: 0.8; }
    }
  </style>

  <script>
    // Apply the stored theme before first paint, ahead of the Angular bundle.
    try {
      var t = localStorage.getItem('eaw.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root>
    <div class="boot"><div class="boot-mark"></div></div>
  </app-root>
</body>
</html>
